services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zentra-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://zentra:${POSTGRES_PASSWORD:-zentra_dev_password}@db:5432/zentra?schema=public
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set to your Upstash connection string}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set to a secret of at least 32 characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set to a secret of at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
    volumes:
      - zentra_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  db:
    image: postgres:16-alpine
    container_name: zentra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zentra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zentra_dev_password}
      POSTGRES_DB: zentra
    volumes:
      - zentra_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentra -d zentra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zentra_pgdata:
  zentra_uploads:
