name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zentra
          POSTGRES_PASSWORD: zentra_dev_password
          POSTGRES_DB: zentra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zentra -d zentra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Typecheck (lint)
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://zentra:zentra_dev_password@localhost:5432/zentra_test?schema=public
          TEST_DATABASE_URL: postgresql://zentra:zentra_dev_password@localhost:5432/zentra_test?schema=public
          TEST_REDIS_URL: redis://localhost:6379/15
          JWT_ACCESS_SECRET: ci-access-secret-at-least-32-chars-long
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars-long
